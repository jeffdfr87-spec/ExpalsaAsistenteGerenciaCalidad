<body>
<div id="root"><div class="loader">Preparando plataforma de capacitación…</div></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script type="module">
import {createPhotoManager} from "./capacitacion-fotos.js?v=20261101-foto-principal-4";
import {crearReporteCapacitacion} from "./capacitacion-reporte.js?v=20261101-fix2";
import {createTrainingTimer} from "./capacitacion-cronometro.js?v=20261101-timer2";
import {createTrainingDocuments} from "./capacitacion-documentos.js?v=20261102-plan-firmado-1";
import {createProgressGraphs} from "./capacitacion-avances-grafico.js?v=20261103-radar-individual-1";
import {createFinalReport} from "./capacitacion-informe-final.js?v=20261102-ejecutivo-3";
import {createResponsible} from "./capacitacion-responsable.js?v=20261102-responsable-1";
import {createCompliance} from "./capacitacion-complementos.js?v=20261102-solo-activos-2";
import {createTrainingEvaluation} from "./capacitacion-evaluacion.js?v=20261103-plan-2";
const days=window.EXPALSA_CAPACITACION_DIAS||[];
const stations=window.EXPALSA_CAPACITACION_PUESTOS||[];
const COMP=[
 {id:'C1',label:'BPM, POES y EPP',w:15,critical:true},
 {id:'C2',label:'Camarón y defectos',w:10,critical:false},
 {id:'C3',label:'Muestreo, cuenta y uniformidad',w:15,critical:false},
 {id:'C4',label:'Balanzas, tara, pesos, termómetros y detector de metales',w:15,critical:false},
 {id:'C5',label:'Fichas, orden y laboratorio',w:10,critical:true},
 {id:'C6',label:'Cadena de frío y flujo',w:10,critical:false},
 {id:'C7',label:'HACCP y control específico',w:10,critical:true},
 {id:'C8',label:'Contención, trazabilidad y cierre',w:10,critical:true},
 {id:'C9',label:'Cobertura y comunicación',w:3,critical:false},
 {id:'C10',label:'Registros, integridad de datos y etiquetas',w:2,critical:true}
];
const P='expalsa_capacitacion_2026_participantes';
const S='expalsa_capacitacion_2026_sesiones';
const root=document.getElementById('root');
const $=id=>document.getElementById(id);
const enc=s=>String(s==null?'':s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt=s=>String(s||'').replace(/[-_]/g,' ');
const n=v=>Number(v)||0;
const uid=()=>crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):String(Date.now())+Math.random().toString(36).slice(2);
const numDay=v=>Math.min(10,Math.max(1,parseInt(v,10)||1));
const sourceDay=d=>days[numDay(d)-1];
const byStation=id=>stations.find(s=>s.id===id);
const dateNow=()=>{const d=new Date(),z=v=>String(v).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());};
let fs=null,db=null,auth=null,currentUser=null,photoManager=null,trainingTimer=null;
async function loadProgressExamplePeople(){
 if(!currentUser)throw new Error('Inicia sesión para consultar los inspectores.');
 const uid=currentUser.uid;
 const people=state.accounts.filter(a=>a.name).map(a=>{
  const registered=state.people.find(p=>p.accountUid===a.id&&p.active===true&&p.deleted!==true);
  return {...registered,id:registered?.id||a.id,accountUid:a.id,name:a.name,active:true,deleted:false};
 });
 let storageModule;
 return Promise.all(people.map(async p=>{
  let portrait=photoUrl(p.accountUid);
  if(!/^(data:image\/(jpeg|png);base64,|blob:)/.test(portrait)){
   portrait='';
   const photo=state.photoDocs.get(p.accountUid);
   if(photo?.uid===p.accountUid&&photo.path==='expalsa_calidad_fotos/'+p.accountUid+'/perfil.jpg'){
    try{
     storageModule=storageModule||import('https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js');
     const st=await storageModule;
     const blob=await st.getBlob(st.ref(st.getStorage(auth.app),photo.path),1500000);
     if(blob.type==='image/jpeg'||blob.type==='image/png'){
      portrait=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);});
     }
    }catch(error){/* La ficha sigue disponible cuando no hay foto accesible. */}
   }
  }
  if(currentUser?.uid!==uid)throw new Error('La sesión cambió.');
  return {...p,portrait};
 }));
}

const trainingEvaluation=createTrainingEvaluation({context:()=>({fs,db,user:currentUser,days,people:()=>state.accounts.filter(a=>a.name).map(a=>({accountUid:a.id,name:a.name,portrait:photoUrl(a.id)}))}),notify:toast});
const progressGraphs=createProgressGraphs({context:()=>({fs,db,user:currentUser,days,competencies:COMP,examplePeople:loadProgressExamplePeople,nameFor:p=>officialName(p.accountUid)||p.name,identityFor:p=>state.identities.get(p.accountUid)||{},areaFor:p=>stationName(p),photoFor:p=>photoUrl(p.accountUid)}),notify:toast});
const finalReport=createFinalReport({context:()=>({fs,db,user:currentUser,days,competencies:COMP,nameFor:p=>officialName(p.accountUid)||p.name,identityFor:p=>state.identities.get(p.accountUid)||{},areaFor:p=>stationName(p),photoFor:p=>photoUrl(p.accountUid)}),notify:toast});
const responsible=createResponsible({context:()=>({fs,db,user:currentUser}),notify:toast});
const compliance=createCompliance({context:()=>({fs,db,user:currentUser,people:state.people.map(p=>({...p,name:officialName(p.accountUid)||p.name}))}),notify:toast});
const documentsManager=createTrainingDocuments({getAuth:()=>auth,getAuthorized:()=>!!currentUser&&currentUser.uid===auth?.currentUser?.uid,notify:toast});
let activeSave=null,autoTimer=null,queued=false,pendingClose=false,editSeq=0,toastTimer=null,uiTimer=null;
const state={tab:'overview',date:dateNow(),day:1,person:'',people:[],sessions:new Map(),accounts:[],identities:new Map(),profileNames:new Map(),photoDocs:new Map(),photoUrls:new Map(),photoJobs:new Map(),draft:null,loading:false,saveState:'',accountChecked:false};
function toast(msg){let node=$('toast');node.textContent=msg;node.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.add('hidden'),3800);}
function statusTag(s){if(!s)return '<span class="tag gray">Sin iniciar</span>';if(s.status==='done')return '<span class="tag good">Finalizada</span>';return '<span class="tag warn">Borrador</span>';}
function stationName(p){return byStation(p.station)?.label||p.station||'Sin área';}

function officialName(uid){
  const t=state.identities.get(uid)||{};
  const names=String(t.firstNames||'').trim(),last=String(t.lastNames||'').trim();
  const canonical=[names,last].filter(Boolean).join(' ').trim();
  const fallback=state.profileNames.get(uid)||'';
  return canonical||(!fallback.includes('@')?fallback:'');
}
function photoUrl(uid){
  if(!uid)return '';
  if(state.photoUrls.has(uid))return state.photoUrls.get(uid)||'';
  const p=state.photoDocs.get(uid);
  if(p?.uid!==uid||p.path!=='expalsa_calidad_fotos/'+uid+'/perfil.jpg')return '';
  if(typeof p.jpeg==='string'&&p.jpeg.length<500000&&/^[A-Za-z0-9+/=]+$/.test(p.jpeg)){
    const url='data:image/jpeg;base64,'+p.jpeg;
    state.photoUrls.set(uid,url);
    return url;
  }
  return '';
}
function personAvatar(uid,name=''){
  const url=photoUrl(uid);
  const id=' data-portrait-uid="'+enc(uid||'')+'" data-portrait-name="'+enc(name)+'"';
  if(url)return '<img class="avatar"'+id+' src="'+enc(url)+'" alt="Foto de perfil de '+enc(name)+'" loading="lazy">';
  const initial=String(name||'?').trim().split(/\s+/).slice(0,2).map(v=>v[0]||'').join('').toUpperCase()||'?';
  return '<span class="avatar avatar-fallback"'+id+' aria-label="Sin fotografía registrada">'+enc(initial)+'</span>';
}
function syncPhoto(uid){
  document.querySelectorAll('[data-portrait-uid]').forEach(el=>{
    if(el.getAttribute('data-portrait-uid')!==uid)return;
    el.outerHTML=personAvatar(uid,el.getAttribute('data-portrait-name')||'');
  });
  const preview=$('linkedPreview');
  if(preview&&$('newAccount')?.value===uid)preview.innerHTML=linkedPreview(uid);
}
async function loadLegacyPhoto(uid){
  if(!uid||state.photoUrls.has(uid)||state.photoJobs.has(uid)||!state.photoDocs.has(uid))return;
  const photo=state.photoDocs.get(uid);
  if(photo?.jpeg)return;
  const task=(async()=>{
    try{
      const st=await import('https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js');
      const storage=st.getStorage(auth.app);
      const url=await st.getDownloadURL(st.ref(storage,'expalsa_calidad_fotos/'+uid+'/perfil.jpg'));
      if(currentUser&&state.photoDocs.get(uid)===photo){
        state.photoUrls.set(uid,url);
        syncPhoto(uid);
      }
    }catch(error){
      console.warn('Fotografía anterior no disponible',uid,error?.code||error?.message||error);
    }finally{state.photoJobs.delete(uid);}
  })();
  state.photoJobs.set(uid,task);
  await task;
}
function linkedPreview(uid){
  if(!uid)return '';
  const a=state.accounts.find(x=>x.id===uid);
  if(!a)return '';
  const name=a.name||'Nombre no registrado';
  return '<div class="linked-preview">'+personAvatar(uid,name)+'<div><strong>'+enc(name)+'</strong><small>'+enc(a.email)+'</small><small>'+(photoUrl(uid)?'Foto de perfil':'Sin fotografía disponible')+'</small></div></div>';
}
function fillAccountSelection(uid){
  const a=state.accounts.find(x=>x.id===uid);
  const name=$('newName'),email=$('newEmail'),preview=$('linkedPreview');
  if(!name||!email||!preview)return;
  if(a){
    name.value=a.name||'';
    email.value=a.email||'';
    name.readOnly=true;
    email.readOnly=true;
    preview.innerHTML=linkedPreview(a.id);
    loadLegacyPhoto(a.id);
  }else{
    name.value='';
    email.value='';
    name.readOnly=false;
    email.readOnly=false;
    preview.replaceChildren();
  }
}

function sessId(person,day){return person+'__D'+String(day).padStart(2,'0');}
function sess(person,day){return state.sessions.get(sessId(person,day));}
function activePeople(){return state.people.filter(p=>p.active===true&&p.deleted!==true).sort((a,b)=>stations.findIndex(s=>s.id===a.station)-stations.findIndex(s=>s.id===b.station));}
function completedRows(){return [...state.sessions.values()].filter(s=>s.status==='done'&&activePeople().some(p=>p.id===s.personId));}
function percent(s){const rates=Object.values(s?.ratings||{}).filter(v=>Number.isInteger(v)&&v>=0&&v<=4);return rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length/4*100):null;}
function criticalMiss(s){const d=sourceDay(s?.day);return !!d?.checks.some(c=>c.critical&&Number.isInteger(s?.ratings?.[c.id])&&s.ratings[c.id]<3);}
function needsFollow(s){return !!s && (criticalMiss(s)||Object.values(s.ratings||{}).some(v=>Number.isInteger(v)&&v<3)||!!s.followup?.trim());}
function pendingFollowups(){return completedRows().filter(s=>needsFollow(s)&&!s.followupResolved);}
function personMetrics(p){const rows=Array.from({length:10},(_,i)=>sess(p.id,i+1)).filter(s=>s?.status==='done'),scores=rows.map(percent).filter(v=>v!==null);return {done:rows.length,avg:scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null,issues:rows.filter(s=>needsFollow(s)&&!s.followupResolved).length};}
function personReadiness(p){const m=personMetrics(p);const rows=Array.from({length:10},(_,i)=>sess(p.id,i+1)).filter(Boolean);const critical=rows.some(r=>r.status==='done'&&criticalMiss(r));const low=rows.some(r=>r.status==='done'&&Object.values(r.ratings||{}).some(v=>Number.isInteger(v)&&v<3));return m.done===10&&!critical&&!low&&m.avg>=85?'Práctica demostrada':m.done===10?'Requiere refuerzo':'En desarrollo';}
function headbar(){const labels={overview:'Centro de control',calendar:'Cronograma diario',evaluation:'Capacitación en planta',trainingEvaluation:'Evaluación de capacitación',people:'Inspectores y áreas',reports:'Resultados y reportes',progress:'Gráfico de avances',finalReport:'Informe final del plan',compliance:'Calibración y reclamos',plan:'Plan de capacitación'};return '<header class="topbar"><div><div class="eyebrow">Programa técnico · 2026 · EXPALSA</div><h1>'+labels[state.tab]+'</h1></div><div class="top-actions"><span id="globalTrainingTimer" class="pill" hidden></span><span class="pill">'+(state.tab==='trainingEvaluation'?'Evaluación del plan · tiempo configurable':'10 jornadas · 30 min por inspector')+'</span><button class="button sm" data-action="refresh">Actualizar</button></div></header>';}
function nav(){const opts=[['overview','⌂','Inicio'],['calendar','▦','Cronograma'],['evaluation','✓','Capacitación'],['trainingEvaluation','▣','Evaluación'],['people','♧','Inspectores'],['reports','▤','Informes'],['compliance','◎','Calibración y reclamos'],['progress','↗','Gráfico de avances'],['finalReport','▧','Informe final del plan'],['plan','▣','Plan de capacitación']];return '<aside class="sidebar"><div class="brand"><img src="./favicon.png" alt=""><div><strong>EXPALSA</strong><small>GERENCIA DE CALIDAD</small></div></div><div class="nav">'+opts.map(x=>'<button data-tab="'+x[0]+'" class="'+(state.tab===x[0]?'active':'')+'"><span class="nav-icon">'+x[1]+'</span>'+x[2]+'</button>').join('')+'</div><div class="side-bottom"><strong>'+enc(currentUser?.email||'')+'</strong><button data-action="logout">Cerrar sesión</button></div></aside>';}
function shell(){root.innerHTML='<div class="app">'+nav()+'<div class="main">'+headbar()+'<main class="content" id="content">'+view()+'</main></div></div>';}
function view(){if(state.tab==='trainingEvaluation')return trainingEvaluation.view();if(state.tab==='overview')return overview();if(state.tab==='calendar')return calendar();if(state.tab==='people')return peopleView();if(state.tab==='reports')return reports();if(state.tab==='progress')return progressGraphs.view();if(state.tab==='finalReport')return finalReport.view();if(state.tab==='compliance')return compliance.view();if(state.tab==='plan')return planView();return evaluator();}
function render(){if(currentUser){shell();if(state.tab==="evaluation")photoManager?.activate();if(state.tab==='trainingEvaluation')trainingEvaluation.activate();if(state.tab==="people")responsible.activate();if(state.tab==="finalReport")finalReport.activate();if(state.tab==="progress")progressGraphs.activate();if(state.tab==="plan")documentsManager.activate();if(state.tab==="compliance")compliance.activate();trainingTimer?.refresh();}}
function quickStart(){if(!activePeople().length)return '<div class="empty"><strong>Sin inspectores asignados</strong><div style="margin-top:15px"><button class="button primary" data-tab="people">Configurar inspectores</button></div></div>';return '<div class="grid2">'+activePeople().slice(0,10).map(p=>{const m=personMetrics(p);return '<div class="mini-card"><div class="spread"><strong>'+enc(p.name)+'</strong>'+statusTag(sess(p.id,state.day))+'</div><span class="muted small">'+enc(stationName(p))+'</span><div class="bar"><span style="width:'+(m.done*10)+'%"></span></div><div class="spread"><span class="small muted">'+m.done+'/10 jornadas</span><button class="button sm" data-open="'+enc(p.id)+'">Capacitar</button></div></div>';}).join('')+'</div>';}
function overview(){const ps=activePeople(),sessions=completedRows(),scores=sessions.map(percent).filter(v=>v!==null),totalAvg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null,done=sessions.length;return '<div class="stack"><div class="hero"><div><div class="micro" style="letter-spacing:.15em;color:#7fdae5;font-weight:800">DESARROLLO DE COMPETENCIAS EN PLANTA</div><h2 style="margin:10px 0">Plan de capacitación · 10 días</h2></div><div class="big">'+Math.round(done/100*100)+'%</div></div><div class="grid4"><div class="panel kpi"><span>Inspectores asignados</span><b>'+ps.length+'/10</b></div><div class="panel kpi"><span>Sesiones completadas</span><b>'+done+'/100</b></div><div class="panel kpi"><span>Promedio práctico</span><b>'+(totalAvg===null?'—':totalAvg+'%')+'</b></div><div class="panel kpi"><span>Refuerzos abiertos</span><b>'+pendingFollowups().length+'</b></div></div><div class="grid2"><section class="panel"><div class="section-title"><h2>Ruta de capacitación</h2><button class="button sm" data-tab="calendar">Ver matriz</button></div><div class="info-list">'+days.map(d=>{const count=ps.filter(p=>sess(p.id,d.day)?.status==='done').length;return '<div class="spread"><div style="min-width:0"><b class="small">D'+String(d.day).padStart(2,'0')+' · '+enc(d.title)+'</b><div class="muted micro">'+count+'/'+ps.length+' inspectores</div></div><button class="button sm flat" data-day="'+d.day+'" data-goto="evaluation">Abrir</button></div>';}).join('')+'</div></section><section class="panel"><div class="section-title"><h2>Seguimiento prioritario</h2><button class="button sm" data-tab="reports">Informes</button></div>'+(pendingFollowups().length?'<div class="info-list">'+pendingFollowups().slice(0,8).map(s=>{const p=state.people.find(x=>x.id===s.personId);return '<div class="info-item"><div class="bullet">!</div><div style="flex:1"><strong>'+enc(p?.name||s.personId)+'</strong><p>Día '+s.day+' · '+enc(s.followup||'Existe una competencia por reforzar')+'</p></div><button class="button sm" data-open="'+enc(s.personId)+'" data-day="'+s.day+'">Abrir</button></div>';}).join('')+'</div>':'<div class="empty"><strong>Sin refuerzos abiertos</strong></div>')+'</section></div></div>';}
function calendar(){const ps=activePeople();return '<div class="stack"><section class="panel"><div class="section-title"><div><h2>Matriz de 10 días × 10 inspectores</h2></div><button class="button sm" data-action="print">Imprimir</button></div><div class="tablewrap"><div class="heatmap"><div class="hm-head">ÁREA / INSPECTOR</div>'+days.map(d=>'<div class="hm-head">D'+d.day+'</div>').join('')+ps.map(p=>'<div class="hm-name" title="'+enc(p.name)+' · '+enc(stationName(p))+'"><b>'+enc(stationName(p))+'</b><br><span class="micro muted">'+enc(p.name)+'</span></div>'+days.map(d=>{const s=sess(p.id,d.day),cl=!s?'':s.status==='done'?(needsFollow(s)&&!s.followupResolved?'issue':'done'):'draft';return '<button class="hm '+cl+'" data-open="'+enc(p.id)+'" data-day="'+d.day+'" title="'+enc(p.name)+' · día '+d.day+' · '+(s?enc(s.status):'sin iniciar')+'">'+(s?.status==='done'?(percent(s)??'—')+'%':s?'••':'—')+'</button>';}).join('')).join('')+'</div></div><div class="tags" style="margin-top:15px"><span class="tag gray">Sin iniciar</span><span class="tag warn">Borrador</span><span class="tag good">Finalizada</span><span class="tag bad">Refuerzo pendiente</span></div></section><section class="panel"><div class="section-title"><h2>Contenido por jornada</h2></div><div class="grid2">'+days.map(d=>'<div class="mini-card"><div class="spread"><strong>Día '+d.day+' · '+enc(d.title)+'</strong></div><div class="small muted">'+enc(d.objective)+'</div><div class="spread"><span class="tag gray">'+d.checks.length+' criterios</span><div class="day-document-actions"><button class="button sm" data-download-day="'+d.day+'">Descargar PDF</button><button class="button sm" data-day="'+d.day+'" data-goto="evaluation">Abrir jornada</button></div></div></div>').join('')+'</div></section></div>';}
function planView(){return '<div class="stack"><section class="panel"><div class="section-title"><h2>Plan de capacitación · Inspectores de Calidad 2026</h2><button class="button primary sm" data-action="downloadPlan">Descargar PDF</button></div><p class="note">Versión firmada del plan · Incluye los apartados 6.1 y 6.2. El seguimiento está disponible en Calibración y reclamos.</p><div id="planPdfStatus" class="note" role="status"></div><iframe id="planPdfFrame" class="plan-pdf-viewer" title="Plan de capacitación de inspectores de calidad"></iframe></section></div>';}
function dayButtons(){return '<div class="quick-day">'+days.map(d=>'<button class="day-btn '+(d.day===state.day?'active':'')+'" data-day="'+d.day+'">'+String(d.day).padStart(2,'0')+'</button>').join('')+'</div>';}
function newDraft(p,d){return {id:sessId(p.id,d),personId:p.id,personName:p.name,station:p.station,day:d,date:dateNow(),minutes:30,attendance:'asistio',ratings:{},notes:'',followup:'',followupResolved:false,evidenceImage:'',status:'draft',rev:0};}
function loadDraft(){const p=activePeople().find(x=>x.id===state.person);if(!p){state.draft=null;return;}const saved=sess(p.id,state.day);state.draft=saved?JSON.parse(JSON.stringify(saved)):newDraft(p,state.day);}
function selectPerson(id){state.person=id;loadDraft();state.tab='evaluation';render();}
function selectDay(day){state.day=numDay(day);loadDraft();render();}
function personSelect(){const ps=activePeople();return '<div class="form-field"><label>Inspector que estás acompañando</label><select id="evalPerson"><option value="">Seleccionar inspector</option>'+ps.map(p=>'<option value="'+enc(p.id)+'" '+(p.id===state.person?'selected':'')+'>'+enc(p.name)+' · '+enc(stationName(p))+'</option>').join('')+'</select></div>';}
function scoreBox(c,ratings){const value=ratings?.[c.id];return '<div class="criterion"><div class="spread"><div><b>'+enc(c.label)+'</b><div><small>'+c.c+' · Nivel demostrado durante la visita</small>'+(c.critical?'<span class="flag"> · CRÍTICO</span>':'')+'</div></div>'+(Number.isInteger(value)?'<span class="tag '+(value<3?'bad':'good')+'">'+value+'/4</span>':value==='na'?'<span class="tag gray">No aplica</span>':'<span class="tag gray">Sin calificar</span>')+'</div><div class="rating">'+[0,1,2,3,4].map(i=>'<button type="button" data-rate="'+c.id+'" data-value="'+i+'" class="'+(value===i?'selected '+(i<3?'low':''):'')+'" title="'+['No ejecuta','Necesita guía constante','Ejecuta con ayuda','Ejecuta correctamente','Anticipa y verifica'][i]+'">'+i+'</button>').join('')+'<button type="button" class="na '+(value==='na'?'selected':'')+'" data-rate="'+c.id+'" data-value="na">N/A</button><button type="button" class="button sm photo-criterion-btn" data-photo-criterion="'+c.id+'" title="Fotografía de evidencia de '+enc(c.label)+'" '+(state.draft?.status==='done'?'disabled':'')+'>📷 Foto</button></div>'+(photoManager?.criterionHtml?.(state.draft,c.id)||'')+'</div>';}
function evalSidebar(day,p,d){const area=(byStation(p.station)?.kind||'machines'),local=area==='brine'?day.brine:area==='tornado'?day.tornado:day.machines;return '<div class="stack"><section class="panel"><div class="section-title"><h2>Guía del día '+day.day+'</h2></div><h3>'+enc(day.title)+'</h3><p class="subhead">'+enc(day.objective)+'</p><div class="focus"><b>Aplicación en '+enc(stationName(p))+':</b><br>'+enc(local)+'</div><h3 style="margin:18px 0 8px">Puntos que reforzarás</h3><div class="info-list">'+day.points.map((x,i)=>'<div class="small" style="display:flex;gap:9px"><span class="tag gray">'+(i+1)+'</span><span>'+enc(x)+'</span></div>').join('')+'</div><a href="'+enc(day.url)+'" target="_blank" rel="noopener noreferrer" class="button flat" style="display:block;text-align:center;margin-top:17px;text-decoration:none">Abrir fuente científica en español ↗</a><p class="note" style="margin:9px 0 0">'+enc(day.source)+'</p></section></div>';}
function evaluator(){const day=sourceDay(state.day),p=state.people.find(x=>x.id===state.person),d=state.draft;return '<div class="stack"><section class="panel"><div class="section-title"><h2>'+enc(day.title)+'</h2><span class="tag">Día '+state.day+'/10</span></div>'+dayButtons()+'<div class="form-grid" style="margin-top:16px">'+personSelect()+'<div class="form-field"><label>Fecha de visita</label><input type="date" id="evalDate" value="'+enc(d?.date||dateNow())+'" '+(!p?'disabled':'')+'></div></div></section>'+(!p?'<div class="empty"><strong>Selecciona un inspector</strong></div>': '<div class="split-eval"><div class="stack"><section class="panel"><div class="section-title"><div class="inspector-identity">'+personAvatar(p.accountUid,officialName(p.accountUid)||p.name)+'<div><h2>'+enc(officialName(p.accountUid)||p.name)+'</h2><span class="small muted">'+enc(stationName(p))+' · '+enc(p.email||'Sin vincular a una cuenta')+'</span></div></div>'+statusTag(d)+'</div><div class="form-grid"><div class="form-field"><label>Asistencia</label><select id="evalAttendance"><option value="asistio" '+(d.attendance==='asistio'?'selected':'')+'>Asistió</option><option value="no_asistio" '+(d.attendance==='no_asistio'?'selected':'')+'>No asistió</option><option value="reprogramado" '+(d.attendance==='reprogramado'?'selected':'')+'>Reprogramado</option></select></div><div class="form-field"><label>Minutos reales de acompañamiento</label><div class="training-minute-line"><input type="number" min="1" max="480" step="1" id="evalMinutes" value="'+enc(d.minutes)+'"><button type="button" class="button primary" id="trainingTimerStart" data-training-timer-start>Iniciar</button><button type="button" class="button" id="trainingTimerStop" data-training-timer-stop disabled>Detener</button></div><div class="training-clock-row"><span id="trainingCountdown" class="training-countdown" role="timer" aria-label="Tiempo restante" hidden></span><span id="trainingTimerPerson" class="training-clock-person" hidden></span></div></div></div><div class="spread" style="margin-top:15px"><h3 style="margin:0">Matriz de observación</h3><span class="tag">0–4 por criterio</span></div>'+day.checks.map(c=>scoreBox(c,d.ratings)).join('')+'<div class="spread" style="margin-top:15px"><strong>Resultado de la jornada</strong><strong>'+(percent(d)===null?'Sin calificar':percent(d)+'%')+'</strong></div></section><section class="panel"><h2>Registro técnico de la visita</h2><div class="form-field"><label>Hallazgos y evidencias observadas</label><textarea id="evalNotes" placeholder="Qué observaste, mediciones, explicación y decisiones del inspector…">'+enc(d.notes)+'</textarea></div><div class="form-field" style="margin-top:14px"><label>Acción de refuerzo o seguimiento</label><textarea id="evalFollowup" placeholder="Corrección técnica, acompañamiento o nueva comprobación requerida…">'+enc(d.followup)+'</textarea></div><div class="row" style="margin:14px 0"><label class="small"><input type="checkbox" id="evalResolved" '+(d.followupResolved?'checked':'')+'> Refuerzo verificado y cerrado</label></div><div id="photoMount"></div>'+'<div class="row" style="margin-top:20px"><button class="button primary" data-action="saveDraft">Guardar borrador</button><button class="button good" data-action="finalize" '+(d.status==='done'?'disabled':'')+'>Finalizar jornada</button><button class="button" data-action="reportPdf">Crear reporte PDF</button>'+(d.status==='done'?'<button class="button" data-action="reopen">Reabrir</button>':'')+'</div><p class="note" id="saveStatus" style="margin:12px 0 0">'+enc(state.saveState||'')+'</p></section></div>'+evalSidebar(day,p,d)+'</div>')+'</div>';}
function peopleView(){const ps=activePeople();const used=new Set(ps.map(p=>p.station));const accountOpts=state.accounts.map(a=>'<option value="'+enc(a.id)+'">'+enc(a.name||'Sin nombre registrado')+' · '+enc(a.email)+'</option>').join('');return '<div class="stack">'+responsible.view()+'<section class="panel"><div class="section-title"><h2>Asignación del equipo · '+ps.length+'/10</h2><span class="tag">Un inspector por puesto</span></div><p class="note">Retirar del grupo solo desactiva la asignación actual. Puedes volver a registrar a la misma persona en otro turno o grupo; su nuevo seguimiento comienza sin resultados anteriores.</p><div class="form-grid"><div class="form-field"><label>Nombre y apellido</label><input id="newName" placeholder="Nombre completo del inspector" maxlength="100"></div><div class="form-field"><label>Área de trabajo</label><select id="newStation"><option value="">Selecciona un área</option>'+stations.map(s=>'<option value="'+s.id+'" '+(used.has(s.id)?'disabled':'')+'>'+enc(s.label)+(used.has(s.id)?' · ocupada':'')+'</option>').join('')+'</select></div><div class="form-field"><label>Cuenta vinculada (opcional)</label><select id="newAccount"><option value="">Sin vincular por ahora</option>'+accountOpts+'</select></div><div class="form-field"><label>Correo electrónico (opcional)</label><input id="newEmail" placeholder="inspector@expalsaevaluations.com" maxlength="150"></div></div><div id="linkedPreview" aria-live="polite"></div><button class="button primary" data-action="addPerson" style="margin-top:18px" '+(ps.length>=10?'disabled':'')+'>+ Registrar inspector</button></section><section class="panel"><div class="section-title"><h2>Personal asignado</h2><button class="button sm" data-action="refresh">Actualizar</button></div>'+(ps.length?'<div class="tablewrap"><table><thead><tr><th>Área</th><th>Inspector</th><th>Cuenta</th><th>Días</th><th>Promedio</th><th>Acciones</th></tr></thead><tbody>'+ps.map(p=>{const m=personMetrics(p);return '<tr><td><strong>'+enc(stationName(p))+'</strong></td><td><div class="inspector-identity">'+personAvatar(p.accountUid,officialName(p.accountUid)||p.name)+'<div><b>'+enc(officialName(p.accountUid)||p.name)+'</b></div></div></td><td class="small">'+enc(p.email||'Sin vincular')+'</td><td>'+m.done+'/10</td><td>'+(m.avg===null?'—':m.avg+'%')+'</td><td><button class="button sm" data-open="'+enc(p.id)+'">Capacitar</button> <button class="button sm danger" data-disable="'+enc(p.id)+'">Retirar del grupo</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">No hay inspectores asignados. Registra al primero usando el formulario.</div>')+'</section></div>';}
function spark(p){const vs=days.map(d=>{const s=sess(p.id,d.day);return s?.status==='done'?percent(s):null});const coords=vs.map((v,i)=>v===null?null:(9+i*22)+','+(105-v*.9));let parts=[],part=[];coords.forEach(x=>{if(x)part.push(x);else if(part.length){parts.push(part.join(' '));part=[];}});if(part.length)parts.push(part.join(' '));return '<svg viewBox="0 0 235 118" role="img" aria-label="Evolución en diez jornadas" style="width:100%;height:90px"><path d="M9 15H227 M9 60H227 M9 105H227" fill="none" stroke="#dce7eb" stroke-width="1"/>'+parts.map(s=>'<polyline points="'+s+'" fill="none" stroke="#0988a4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>').join('')+coords.map(x=>x?'<circle cx="'+x.split(',')[0]+'" cy="'+x.split(',')[1]+'" r="3.5" fill="#067b97"/>':'').join('')+'</svg>';}
function reports(){const ps=activePeople();const sessions=completedRows();const avg=sessions.length?Math.round(sessions.reduce((a,b)=>a+(percent(b)||0),0)/sessions.length):null;return '<div class="stack"><section class="hero"><div><div class="micro">INFORME DE GERENCIA</div><h2 style="margin:7px 0">Resultados de capacitación</h2></div><div class="big">'+(avg===null?'—':avg+'%')+'</div></section><section class="panel"><div class="section-title"><h2>Resultados por inspector</h2><div class="row no-print"><button class="button sm" data-action="csv">Exportar CSV</button><button class="button sm" data-action="print">Imprimir / PDF</button></div></div>'+(ps.length?'<div class="tablewrap"><table><thead><tr><th>Inspector</th><th>Área</th><th>Visitas</th><th>Promedio práctico</th><th>Refuerzos</th><th>Preparación formativa</th></tr></thead><tbody>'+ps.map(p=>{const m=personMetrics(p);return '<tr><td><b>'+enc(p.name)+'</b></td><td>'+enc(stationName(p))+'</td><td>'+m.done+'/10</td><td>'+(m.avg===null?'—':m.avg+'%')+'</td><td>'+m.issues+'</td><td><span class="tag '+(personReadiness(p)==='Práctica demostrada'?'good':personReadiness(p)==='Requiere refuerzo'?'bad':'warn')+'">'+personReadiness(p)+'</span></td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">Registra participantes para generar el informe.</div>')+'</section><section class="grid2">'+ps.map(p=>{const m=personMetrics(p);return '<div class="panel"><div class="spread"><div><h3 style="margin:0">'+enc(p.name)+'</h3><span class="small muted">'+enc(stationName(p))+'</span></div><strong>'+(m.avg===null?'—':m.avg+'%')+'</strong></div>'+spark(p)+'<div class="spread"><span class="muted small">'+m.done+' jornadas cerradas · '+m.issues+' refuerzos abiertos</span><button class="button sm no-print" data-open="'+enc(p.id)+'">Ver</button></div></div>';}).join('')+'</section></div>';}
function login(msg){root.innerHTML='<div class="login-wrap"><div class="login"><div class="brand"><img src="./favicon.png" alt=""><div><strong>EXPALSA</strong><small>DESARROLLO TÉCNICO</small></div></div><div class="eyebrow" style="margin-top:20px;color:#0d8397">ACCESO RESTRINGIDO</div><h2>Control de capacitación</h2><form id="loginForm"><div class="form-field"><label>Correo de administrador</label><input type="email" id="loginEmail" autocomplete="username" required></div><div class="form-field"><label>Contraseña</label><input type="password" id="loginPassword" autocomplete="current-password" required></div><button class="button primary" type="submit">Ingresar a la plataforma</button></form><p id="authMsg">'+enc(msg||'')+'</p><a class="small" href="./index.html">Volver a Evaluación de Inspectores</a></div></div>';}
async function loadCloud(){
  trainingEvaluation.clear();
  progressGraphs.clear();
  finalReport.clear();
  state.loading=true;
  try{
    const [accesses,identities,profiles,photos,participants,sessions]=await Promise.all([
      fs.getDocs(fs.collection(db,'expalsa_calidad_accesos')),
      fs.getDocs(fs.collection(db,'expalsa_calidad_identidades')),
      fs.getDocs(fs.collection(db,'expalsa_calidad_perfiles')),
      fs.getDocs(fs.collection(db,'expalsa_calidad_fotos_perfil')),
      fs.getDocs(fs.collection(db,P)),
      fs.getDocs(fs.collection(db,S))
    ]);
    state.identities=new Map(identities.docs.map(x=>[x.id,x.data()]));
    state.profileNames=new Map(profiles.docs.map(x=>x.data().payload).filter(x=>x?.accountUid&&x?.name).map(x=>[x.accountUid,String(x.name).trim()]));
    state.photoDocs=new Map(photos.docs.map(x=>[x.id,x.data()]));
    state.photoUrls.clear();
    state.accounts=accesses.docs.filter(x=>x.data().active===true&&x.data().deleted!==true).map(x=>{
      const d=x.data(),name=officialName(x.id);
      return {id:x.id,email:d.email||'',name,hasName:!!name};
    });
    state.people=participants.docs.map(x=>Object.assign({id:x.id},x.data()));
    state.sessions=new Map(sessions.docs.map(x=>[x.id,Object.assign({id:x.id},x.data())]));
    if(!state.people.some(x=>x.id===state.person&&x.active===true&&x.deleted!==true))state.person=activePeople()[0]?.id||'';
    loadDraft();
    state.loading=false;
    state.saveState='Sincronizado con Firestore';
    render();
    for(const p of state.people){
      if(p.active===true&&p.deleted!==true&&p.accountUid&&state.photoDocs.has(p.accountUid)&&!photoUrl(p.accountUid)){
        loadLegacyPhoto(p.accountUid);
      }
    }
  }catch(e){
    state.loading=false;
    root.innerHTML='<div class="login-wrap"><div class="login"><h2>No se pudo cargar la capacitación</h2><p>'+enc(e.message)+'</p><button class="button primary" data-action="refresh">Reintentar</button><div style="margin-top:15px"><a href="./index.html">Volver a evaluaciones</a></div></div></div>';
  }
}
async function init(){login('');const cfg=window.EXPALSA_FIREBASE_CONFIG;if(!cfg?.apiKey||!cfg?.projectId||!days.length){login('No se cargaron la configuración Firebase o los contenidos de las jornadas.');return;}try{const V='13.0.0';const [appMod,authMod,fire]=await Promise.all([import('https://www.gstatic.com/firebasejs/'+V+'/firebase-app.js'),import('https://www.gstatic.com/firebasejs/'+V+'/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/'+V+'/firebase-firestore.js')]);fs=Object.assign({},fire,authMod);const app=appMod.initializeApp(cfg,'expalsa-capacitacion-2026');auth=authMod.getAuth(app);db=fire.getFirestore(app);photoManager=createPhotoManager({fs,db,auth,getSession:()=>state.draft,getSaved:id=>state.sessions.has(id),saveDraft:()=>saveSession(false),isSaving:()=>!!activeSave,notify:toast});await authMod.setPersistence(auth,authMod.browserSessionPersistence);authMod.onAuthStateChanged(auth,async u=>{if(!u){currentUser=null;trainingEvaluation.clear();progressGraphs.clear();finalReport.clear();responsible.clear();compliance.reset();documentsManager.clear();login('');return;}try{if((u.email||'').toLowerCase()!=='jefferson@expalsaevaluations.com')throw Error('Esta aplicación es de uso exclusivo del administrador de Calidad.');const snap=await fire.getDoc(fire.doc(db,'expalsa_calidad_config','administrador'));if(!snap.exists()||snap.data().uid!==u.uid||snap.data().email!==u.email.toLowerCase())throw Error('La cuenta no coincide con la identidad administrativa autorizada.');currentUser=u;if(!trainingTimer)trainingTimer=createTrainingTimer({getSession:()=>state.draft,getPersonName:d=>{const p=state.people.find(x=>x.id===d.personId);return p?(officialName(p.accountUid)||p.name):d.personName;},notify:toast});await loadCloud();}catch(e){currentUser=null;trainingEvaluation.clear();progressGraphs.clear();finalReport.clear();responsible.clear();compliance.reset();documentsManager.clear();login(e.message);}});}catch(e){login('Error al conectar con Firebase: '+e.message);}}
function readForm(){if(!state.draft)return;const d=state.draft;if($('evalDate'))d.date=$('evalDate').value;if($('evalMinutes'))d.minutes=Math.min(480,Math.max(0,parseInt($('evalMinutes').value,10)||0));if($('evalAttendance'))d.attendance=$('evalAttendance').value;if($('evalNotes'))d.notes=$('evalNotes').value.slice(0,8000);if($('evalFollowup'))d.followup=$('evalFollowup').value.slice(0,3000);if($('evalResolved'))d.followupResolved=$('evalResolved').checked;}
function formAuto(){editSeq++;clearTimeout(autoTimer);state.saveState='Cambios pendientes…';const lbl=$('saveStatus');if(lbl)lbl.textContent=state.saveState;autoTimer=setTimeout(()=>saveSession(false),1250);}
async function saveSession(close){if(close&&photoManager?.isBusy()){toast('Espera a que terminen de guardarse las fotografías.');return;}if(!state.draft||!currentUser||!db)return;if(!activePeople().some(p=>p.id===state.draft.personId)){toast('Solo se pueden guardar registros de inspectores activos.');return;}clearTimeout(autoTimer);readForm();const d=JSON.parse(JSON.stringify(state.draft));const seq=editSeq;const src=sourceDay(d.day);if(!d.personId||!src)return;if(close){if(d.attendance!=='asistio'){toast('Para finalizar una práctica, el inspector debe haber asistido.');return;}const answers=src.checks.map(c=>d.ratings?.[c.id]);if(answers.some(v=>v!== 'na' && !Number.isInteger(v))){toast('Debes calificar o marcar N/A en todos los criterios.');return;}if(answers.filter(v=>Number.isInteger(v)).length<2){toast('Se requieren al menos dos criterios evaluados.');return;}if(needsFollow(d)&&!d.followup.trim()){toast('Registra la acción de refuerzo para los criterios con calificación baja.');return;}if(!d.notes.trim()){toast('Describe brevemente la evidencia o hallazgo de la visita.');return;}d.status='done';}
const eventKey=d.personId+'_'+d.day;if(activeSave){queued=true;pendingClose=pendingClose||!!close;state.saveState='Guardando…';return;}activeSave=eventKey;state.saveState='Guardando en Firestore…';if($('saveStatus'))$('saveStatus').textContent=state.saveState;try{const ref=fs.doc(db,S,d.id),result=await fs.runTransaction(db,async tx=>{const participant=await tx.get(fs.doc(db,P,d.personId));if(!participant.exists()||participant.data().active!==true||participant.data().deleted===true)throw Error('El inspector está inactivo o fue eliminado.');const existing=await tx.get(ref),rev=existing.exists()?(existing.data().rev||0):0;const payload=Object.assign({},d,{rev:rev+1,updatedAt:fs.serverTimestamp(),updatedBy:currentUser.uid});if(existing.exists()){payload.createdAt=existing.data().createdAt||fs.serverTimestamp();tx.set(ref,payload);}else{payload.createdAt=fs.serverTimestamp();tx.set(ref,payload);}return {revision:rev+1};});d.rev=result.revision;state.sessions.set(d.id,d);if(seq===editSeq&&state.person===d.personId&&state.day===d.day){state.draft=JSON.parse(JSON.stringify(d));}state.saveState=close?'Jornada finalizada y guardada.':'Cambios guardados en Firestore.';if(close){toast('Jornada finalizada correctamente.');render();}else if($('saveStatus')){$('saveStatus').textContent=state.saveState;}}catch(e){state.saveState='Error al guardar: '+e.message;if($('saveStatus'))$('saveStatus').textContent=state.saveState;toast(state.saveState);}finally{activeSave=null;if(queued||seq!==editSeq){const finalLater=pendingClose;queued=false;pendingClose=false;if(finalLater){setTimeout(()=>saveSession(true),0);}else{formAuto();}}}}
async function addPerson(){const accountUid=$('newAccount')?.value||'',linked=state.accounts.find(x=>x.id===accountUid),name=linked?linked.name:$('newName')?.value.trim(),station=$('newStation')?.value,email=linked?linked.email:$('newEmail')?.value.trim();if(accountUid&&!linked?.hasName){toast('La cuenta seleccionada no tiene nombres y apellidos registrados en Evaluación.');return;}if(!name||!station){toast('Introduce el nombre completo y selecciona el área.');return;}if(activePeople().length>=10){toast('Ya están cubiertos los 10 puestos.');return;}if(activePeople().some(p=>p.station===station)){toast('El puesto seleccionado ya está asignado.');return;}if(accountUid&&activePeople().some(p=>p.accountUid===accountUid)){toast('La cuenta ya está vinculada con otro inspector.');return;}const id='ci_'+uid();const data={id,name,station,accountUid:accountUid||'',email:email||state.accounts.find(x=>x.id===accountUid)?.email||'',active:true,createdAt:fs.serverTimestamp(),updatedAt:fs.serverTimestamp(),updatedBy:currentUser.uid};try{await fs.setDoc(fs.doc(db,P,id),data);toast('Inspector registrado.');await loadCloud();}catch(e){toast('No se pudo registrar: '+e.message);}}
async function disablePerson(id){const p=state.people.find(x=>x.id===id);if(!p||!confirm('¿Quitar a '+p.name+' del grupo de capacitación? Se liberará su área y dejará de aparecer en el grupo actual, calibración y reclamos. Su cuenta seguirá disponible: podrás volver a registrarlo en otro turno o grupo con un seguimiento nuevo.'))return;try{await fs.updateDoc(fs.doc(db,P,id),{active:false,updatedAt:fs.serverTimestamp(),updatedBy:currentUser.uid});toast('Inspector retirado del grupo. Puedes volver a registrarlo en otro turno o grupo.');await loadCloud();}catch(e){toast(e.message);}}
async function reportPdf(){
  if(!state.draft||!state.person)return toast('Selecciona una jornada y un inspector.');
  if(photoManager?.isBusy()||activeSave)return toast('Espera a que termine el guardado.');
  const d=JSON.parse(JSON.stringify(state.draft));
  const p=state.people.find(x=>x.id===d.personId);
  const day=sourceDay(d.day);
  if(!p||!day)return toast('No se encontró la información del inspector.');
  if(state.saveState==='Cambios pendientes…')await saveSession(false);
  try{
    toast('Preparando reporte PDF…');
    const photos=await photoManager.getReportPhotos(d);
    const info=await crearReporteCapacitacion({day,person:{...p,name:officialName(p.accountUid)||p.name},session:d,photos,score:percent(d),stationName:stationName(p)});
    toast(info&&photos.partial?'PDF generado con foto principal. Los anexos requieren permisos en Firestore.':'Reporte PDF generado: '+info.pages+' página(s), '+info.annexes+' anexo(s).');
  }catch(e){toast('No se pudo generar el PDF: '+e.message);}
}
function csv(){const lines=[['Inspector','Área','Día','Tema','Fecha','Asistencia','Minutos','Estado','Calificación %','Crítico bajo','Observaciones','Refuerzo','Refuerzo cerrado'].join(';')];for(const p of activePeople())for(const day of days){const s=sess(p.id,day.day);lines.push([p.name,stationName(p),day.day,day.title,s?.date||'',s?.attendance||'',s?.minutes||'',s?.status||'sin iniciar',percent(s)??'',criticalMiss(s)?'Sí':'No',s?.notes||'',s?.followup||'',s?.followupResolved?'Sí':'No'].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';'));}const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='EXPALSA_Control_Capacitacion_2026.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);}
async function flushBeforeSwitch(){clearTimeout(autoTimer);let tries=0;while(activeSave&&tries<80){await new Promise(ok=>setTimeout(ok,50));tries++;}if(state.draft&&state.saveState==='Cambios pendientes…')await saveSession(false);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||state.tab!=='people'||b.dataset.responsible)return;if(b.dataset.tab||b.dataset.action||b.dataset.disable||b.dataset.open){if(!responsible.canLeave()){e.preventDefault();e.stopImmediatePropagation();return;}responsible.leave();}},true);
document.addEventListener('click',async ev=>{const el=ev.target.closest('button');if(!el)return;if(state.tab==='trainingEvaluation'&&(el.dataset.tab||['refresh','logout'].includes(el.dataset.action))){try{await trainingEvaluation.beforeLeave();trainingEvaluation.stop();}catch(err){toast(err.message);return;}}if(photoManager?.isBusy()&&(el.dataset.tab||el.dataset.open||el.dataset.day||['refresh','logout','finalize','reopen','reportPdf'].includes(el.dataset.action))){toast('Finaliza la carga de fotografías antes de continuar.');return;}if(el.dataset.tab){if(state.tab==='finalReport'&&el.dataset.tab!=='finalReport')finalReport.clear();if(state.tab==='progress'&&el.dataset.tab!=='progress')progressGraphs.stop();if(state.tab==='compliance'){if(!compliance.canLeave())return;compliance.leave();}await flushBeforeSwitch();if(state.tab==='plan')documentsManager.onNavigateAway();state.tab=el.dataset.tab;render();return;}if(el.dataset.downloadDay){try{await documentsManager.downloadDay(el.dataset.downloadDay);}catch(err){documentsManager.showError(err);}return;}if(el.dataset.open){await flushBeforeSwitch();state.person=el.dataset.open;if(el.dataset.day)state.day=numDay(el.dataset.day);loadDraft();state.tab='evaluation';render();return;}if(el.dataset.day){await flushBeforeSwitch();state.day=numDay(el.dataset.day);loadDraft();if(el.dataset.goto)state.tab=el.dataset.goto;render();return;}if(el.dataset.disable){await disablePerson(el.dataset.disable);return;}if(el.dataset.rate){if(!state.draft||state.draft.status==='done')return;state.draft.ratings[el.dataset.rate]=el.dataset.value==='na'?'na':parseInt(el.dataset.value,10);readForm();formAuto();render();return;}const a=el.dataset.action;if(!a)return;if(a==='refresh'){progressGraphs.clear();finalReport.clear();responsible.clear();if(state.tab==='compliance'){if(!compliance.canLeave())return;compliance.leave();compliance.reset();}await loadCloud();}if(a==='logout'){progressGraphs.clear();finalReport.clear();responsible.clear();if(state.tab==='compliance'&&!compliance.canLeave())return;compliance.reset();documentsManager.clear();await fs.signOut(auth);}if(a==='addPerson')await addPerson();if(a==='saveDraft')await saveSession(false);if(a==='finalize')await saveSession(true);if(a==='reportPdf')await reportPdf();if(a==='downloadPlan'){try{await documentsManager.downloadPlan();}catch(err){documentsManager.showError(err);}}if(a==='csv')csv();if(a==='print')window.print();if(a==='reopen'&&state.draft){if(!confirm('¿Reabrir esta jornada para ajustar el registro?'))return;state.draft.status='draft';await saveSession(false);render();}});
document.addEventListener('change',async e=>{const id=e.target.id;if(id==='evalPerson'){if(photoManager?.isBusy()){e.target.value=state.person;toast('Finaliza la carga de fotografías.');return;}await flushBeforeSwitch();state.person=e.target.value;loadDraft();render();return;}if(id==='newAccount'){fillAccountSelection(e.target.value);return;}if(['evalDate','evalAttendance','evalMinutes','evalResolved'].includes(id)){if(state.draft?.status==='done'){toast('Reabre la jornada para editarla.');return;}readForm();formAuto();}});
document.addEventListener('input',e=>{if(['evalNotes','evalFollowup'].includes(e.target.id)){if(state.draft?.status==='done')return;readForm();formAuto();}});
document.addEventListener('submit',async e=>{if(e.target.id!=='loginForm')return;e.preventDefault();if(!auth){$('authMsg').textContent='La conexión de Firebase todavía no está disponible.';return;}const btn=e.target.querySelector('button');btn.disabled=true;$('authMsg').textContent='Autenticando…';try{await fs.signInWithEmailAndPassword(auth,$('loginEmail').value.trim(),$('loginPassword').value);$('loginPassword').value='';}catch(err){$('authMsg').textContent='No se pudo ingresar: '+err.message;btn.disabled=false;}});
init();
